name: ci

# Checks on every pull request and on every push to the default branch. Branch
# work is covered by the pull_request trigger alone, so a PR push runs the matrix
# once; the default-branch push keeps the merged tip checked. The check job
# builds, vets and tests on macOS and Linux, with race-enabled internal tests on
# both and the `gofmt -l .` format gate, record-lint and docs-lint on the ubuntu
# leg alone. Separate jobs run full-history secret scanning, a workflow audit,
# the reviews-charter discipline, dependency review, govulncheck, and the smoke
# harness.
#
# The `changes` job classifies the diff, and the duplicated lanes stand down on a
# change confined to the record and the user-facing docs. Two properties make
# that safe to rely on:
#
#   - It classifies fail-closed. Only an explicit allowlist counts as inert, and
#     every other outcome — one unlisted path, a non-PR event, an empty diff, an
#     unreadable base, an aborted script, a failed classifier job — runs the full
#     matrix. Markdown and JSON outside that allowlist (commands/, agents/,
#     hooks/, .abcd/*.json, the harness routers at the repo root) carry
#     behaviour, so they are not inert.
#   - It gates jobs and steps, never the workflow triggers. Every required check
#     context still reports on every pull request; `paths:` filtering would leave
#     one permanently pending and wedge the merge.
#
# What an inert change skips is the SECOND copy of the work and the lanes that
# only a source change can move: the macOS leg, the race lane, the smoke harness,
# and the workflow audit (anything under .github/ is not inert, so the audit
# still runs on every change it could be auditing).
#
# What it does not skip is the ubuntu unit lane. Tests read the live tree under
# the allowlist — lifeboat coverage and the glossary index are asserted against
# the real .abcd/development/**, and grounding thresholds against README.md — so
# a prose-only record change can genuinely turn `go test ./...` red while
# record-lint and docs-lint both pass. Skipping it would let that reach the
# default branch. Alongside it the record gates are `go run` invocations of this
# module, so a record-only change compiles most of the module either way.
on:
  push:
    branches: [main]
  pull_request:
  # Merge-queue entries run the full gate on the would-be merge result. The
  # changes classifier below already treats any non-pull_request event as never
  # inert, so a merge_group run executes everything.
  merge_group:

# One group per ref, so a new push to a PR supersedes the run still in flight for
# it. Default-branch pushes all share a single group, so the cancel expression —
# not the group key — is what keeps a merge from being cancelled mid-run by the
# merge behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # Classify the diff so the duplicated lanes can stand down on a change that
  # cannot move them. This job must never fail: a skipped dependent reports the
  # same conclusion whether it stood down deliberately or lost its classifier,
  # and the second reading would let a source change through unbuilt. So it
  # reports its verdict on stdout and exits zero on every path, an abort resolves
  # to the full matrix, and the dependents guard against it failing anyway.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      inert: ${{ steps.classify.outputs.inert }}
    steps:
      # Full history: the diff is taken against the merge base with the pull
      # request's base commit, which a shallow checkout does not carry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the changed paths
        id: classify
        env:
          # Read through the environment rather than expanding the expression
          # into the script body, which would splice event data into shell source.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          inert=false
          reason='the classifier did not reach a verdict'
          written=false
          changed="$RUNNER_TEMP/changed-paths.z"

          # Errexit cannot be the safety net here: a failed step would fail the
          # job and skip the matrix, the one outcome worse than running it. The
          # trap converts every abort into the full matrix, loudly.
          finish() {
            status=$?
            if [ "$written" = false ]; then
              echo "::error::the inert-path classifier aborted (exit ${status}); running the full matrix"
              # Recording the verdict is itself a step that can fail, and it must
              # not take the job down with it: an output nobody set reads as
              # empty, which is already the full matrix.
              if ! printf 'inert=false\n' >>"$GITHUB_OUTPUT"; then
                echo "::error::the verdict could not be recorded either"
              fi
            fi
            exit 0
          }
          trap finish EXIT

          # The inert allowlist: user-facing documentation, the durable record,
          # and the shared working tier, plus the root files that are prose or
          # licence text. The harness routers (AGENTS.md, CLAUDE.md, GEMINI.md)
          # are deliberately absent — they configure agent behaviour.
          is_inert_path() {
            case "$1" in
              docs/*|.abcd/development/*|.abcd/work/*) return 0 ;;
              README.md|CHANGELOG.md|CONTRIBUTING.md|SECURITY.md|ACKNOWLEDGEMENTS.md|LICENSE|LICENSE.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Errexit is suspended inside an `if` condition, so every command below
          # tests its own status. Returning non-zero means "not proven inert".
          classify() {
            if [ "$EVENT_NAME" != pull_request ]; then
              reason="the ${EVENT_NAME} event carries no base to diff against"
              return 1
            fi
            if [ -z "$BASE_SHA" ]; then
              reason='the pull request payload carries no base commit'
              return 1
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              reason="base commit ${BASE_SHA} is absent from this checkout"
              return 1
            fi
            # Three-dot, so the comparison is against the merge base. When the
            # base branch has moved on, the merge base is still the recorded base
            # commit and the diff widens to include what landed meanwhile — which
            # errs towards the full matrix.
            #
            # --no-renames is load-bearing: with detection on, moving a source
            # file into docs/ reports the destination alone, and the vanished
            # source path never reaches the allowlist. Reported as a delete plus
            # an add, both paths are judged.
            if ! git diff --no-renames --name-only -z "${BASE_SHA}...HEAD" -- >"$changed"; then
              reason='diffing against the merge base failed'
              return 1
            fi
            if [ ! -s "$changed" ]; then
              reason='the diff against the merge base is empty'
              return 1
            fi
            echo 'changed paths:'
            # Indented so no byte of a hostile filename lands in column 1,
            # where the runner's log parser reads `::`-prefixed lines as
            # workflow commands.
            tr '\0' '\n' <"$changed" | sed 's/^/  /'
            # NUL-delimited, so a path holding a newline, a space, a glob
            # character or a leading dash stays one record and is only ever
            # matched as a pattern subject, never expanded or executed.
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              if ! is_inert_path "$path"; then
                reason="${path} is outside the inert allowlist"
                return 1
              fi
            done <"$changed"
            reason="all ${count} changed paths are documentation or record"
            return 0
          }

          if classify; then
            inert=true
          fi
          printf 'inert=%s\n' "$inert" >>"$GITHUB_OUTPUT"
          written=true
          # The reason can embed a hostile filename, newlines included; indent
          # every line of it off column 1 for the same non-injection guarantee
          # as the path list.
          echo "verdict: inert=${inert}"
          printf '%s\n' "$reason" | sed 's/^/  /'

  # Build + vet + test on both host OSes. Race-enabled unit tests catch data
  # races the plain `go test` would miss. On an inert change the macos leg and
  # the race lane stand down, while the ubuntu leg builds, vets, tests and runs
  # the record gates as usual. The macos leg is gated step by step rather than
  # dropped from the matrix, so `check (macos-latest)` keeps reporting a
  # conclusion instead of a required context that never arrives.
  #
  # `!cancelled()` rather than the implicit `success()`: a classifier that fails
  # for its own reasons — a flaky checkout, the timeout — must not skip this job.
  # An unset output is empty, which reads as not inert, so the fallback is the
  # full matrix.
  check:
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The ubuntu leg always needs a toolchain, because it always builds and
      # tests. The macos leg needs one only when it is the second opinion on a
      # source change.
      - name: Set up Go
        if: matrix.os == 'ubuntu-latest' || needs.changes.outputs.inert != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'

      # Enforce the format gate AGENTS.md documents (`gofmt -l .`). Formatting is
      # platform-independent, so run it once on the ubuntu leg to avoid duplicate
      # work; any file gofmt lists needs `gofmt -w` and fails the job.
      - name: Format (gofmt)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt: these files are not formatted (run gofmt -w .):" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # Unconditional on ubuntu, because tests assert against the live record;
      # the macos leg is the cross-platform second opinion a record change does
      # not need.
      - name: Build
        if: matrix.os == 'ubuntu-latest' || needs.changes.outputs.inert != 'true'
        run: go build ./...

      - name: Vet
        if: matrix.os == 'ubuntu-latest' || needs.changes.outputs.inert != 'true'
        run: go vet ./...

      - name: Test
        if: matrix.os == 'ubuntu-latest' || needs.changes.outputs.inert != 'true'
        run: go test ./...

      # Only a source change can introduce a data race, and the plain lane above
      # has already run the same tests over the record.
      - name: Test (race, internal)
        if: needs.changes.outputs.inert != 'true'
        run: go test -race ./internal/...

      # Drift gate for the .abcd/development design record. Blocking: a
      # blocker-severity finding exits non-zero and fails the job; warn-level
      # findings surface in the log only.
      - name: Record-lint (drift gate)
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/record-lint

      # Docs-currency gate (itd-60): the internal/core/lint engine over docs/ and
      # the repo root, driven via the `abcd docs lint` verb. Blocking — a doc-body
      # change-narration, broken relative link, or stray root markdown fails CI.
      - name: Docs-lint (currency gate)
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/abcd docs lint

  # Secrets never land in history: full-history scan on every push/PR. Run as a
  # pinned, checksum-verified CLI (no PR-comment / SARIF GitHub-API integration),
  # so it works on a private repo and survives the private->public flip. A
  # non-zero exit means gitleaks found a secret.
  gitleaks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf -o "$base" "$url/$base"
          curl -sSLf -o checksums.txt "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $base\$" checksums.txt | sha256sum -c -
          tar -xzf "$base" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --redact --no-banner .

  # Audit the workflows themselves (pwn requests, template injection, cache
  # poisoning, unpinned uses). Run as a pinned CLI image (no SARIF upload to
  # code-scanning, which a private repo lacks). A non-zero exit means a finding.
  # Anything under .github/ is outside the inert allowlist, so the audit runs on
  # every change that could alter what it audits.
  zizmor:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.inert != 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        run: |
          # zizmor v1.26.1, pinned by digest (the registry publishes version
          # releases under :latest; a raw vX.Y.Z tag does not exist).
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" \
            ghcr.io/zizmorcore/zizmor@sha256:d1117e5dbd9ee4970644067b534ab6ab50371f3c6f7f4d05446eb603a6e78f48 \
            --persona regular /src

  # Deterministic gate for the .abcd/work/reviews/ charter (RD001-RD003). Needs
  # full history: RD002 (append-only) checks committed history for post-creation
  # edits, so fetch-depth: 0 (the default shallow checkout would miss them).
  # Stopgap until the RD codes land in internal/core/lint.
  record-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reviews-charter discipline (RD001-RD003)
        run: bash scripts/check-reviews.sh

  # Self-discovering smoke harness (evals/): builds the binary, walks the Cobra
  # command tree in-process, and runs every command's --help plus the read-only
  # verbs against the built binary. Catches a command that compiles but panics when
  # actually invoked — which the unit lane (go test ./...) misses, because the
  # harness is behind the `smoke` build tag. What it walks is the command tree,
  # which only a source change moves. The read-only verbs also read the live
  # record, which an inert change can edit — a record-only panic surfaces one
  # hop later, on the push-to-main run (non-inert by classification) and again
  # in the release verify job, an accepted latency trade.
  smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.inert != 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
      - name: Smoke every command
        run: make smoke

  # The one supply-chain vector unreadable by eye: a dependency swap. Diffs the
  # PR's dependency changes against the advisory databases and fails on a known
  # vulnerability. pull_request only — the action reads the PR's diff, which a
  # merge_group or push event does not carry — and NOT a required check, so it
  # can never wedge the queue.
  dependency-review:
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Known-vulnerability scan over the module's own dependency graph, on every
  # event (unlike dependency-review it needs no PR diff). Pinned like every
  # other tool this workflow runs.
  govulncheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.inert != 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
